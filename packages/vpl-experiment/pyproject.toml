#  vpl-experiment — manifest → pipeline → artifacts (doc 08 §3).
#
#  This package owns doc 08 §6: one declarative file per experiment, and the three
#  commands that consume it. It is the package doc 00 E3 is measured against, so it
#  depends on the storage extra of vpl-core rather than treating artifact writing as
#  optional — a run that cannot write a provenanced artifact has not run.
#
#  The configuration substrate is OmegaConf alone, with Hydra deferred to the doc 10 §6
#  sweep layer. That is a deviation from the doc 08 §2 build/buy table and is recorded in
#  docs/adr/ADR-008-manifest-substrate.md.

[project]
name = "vpl-experiment"
version = "0.1.0"
description = "Astrophage VPL — the experiment manifest engine and the vpl run/reproduce/compare CLI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Team Astrophage" }]
dependencies = [
    # The storage extra is not optional here: doc 08 §7 requires every artifact to embed
    # its provenance, and this package is the thing that writes them.
    "vpl-core[storage]",
    # The only solver that exists (doc 11 §2 WBS 1.5). `vpl run` has to be able to
    # actually run something, or the manifest engine is untested prose.
    "vpl-physics",
    # doc 08 §3: this is the *only* package permitted to import both vpl-physics and
    # vpl-inverse. `vpl.experiment.closed_loop` (doc 11 §9 item 4, WBS 3.9) is exactly
    # that seam — it wires an L0 forward solve and an OES instrument model to the MAP
    # engine and the sealed-truth barrier, none of which may import each other directly.
    "vpl-instruments",
    "vpl-inverse",
    "vpl-validation",
    # doc 08 §2, "Configuration | Buy". See ADR-008 for why OmegaConf and not yet Hydra.
    "omegaconf>=2.3",
    # The run record of doc 13 §2 is YAML, as is the archived manifest (doc 08 §7).
    "pyyaml>=6.0",
]

[project.scripts]
# doc 08 §6 writes the three commands out verbatim. They are one entry point because
# doc 08 §11 requires the interactive backend to expose "exactly the same operations as
# the CLI" — one dispatch table is the cheapest way for that to stay true.
vpl = "vpl.experiment.cli:main"

[project.entry-points."vpl.solvers"]
# doc 08 §10: a solver becomes resolvable by a manifest by being declared as an entry
# point, never by an edit to the core. The name is the dotted path doc 08 §6 writes into
# `forward.solver`.
#
# **This declaration belongs in vpl-physics and lives here only because the adapter does.**
# `vpl.physics.analytic.AnalyticSheathSolver` predates the ratification of the doc 08 §4
# `ForwardSolver` contract and does not match its signatures; `vpl.experiment.solvers`
# holds the adapter that does. When vpl-physics next implements the protocol natively,
# both the adapter and this line move there and nothing else changes — the manifest still
# says `vpl.physics.analytic.sheath`.
"vpl.physics.analytic.sheath" = "vpl.experiment.solvers:AnalyticSheathForwardSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpl"]

[tool.hatch.build.targets.wheel.force-include]
# PEP 561. Without it every consumer of this package silently loses type checking.
"src/vpl/experiment/py.typed" = "vpl/experiment/py.typed"
