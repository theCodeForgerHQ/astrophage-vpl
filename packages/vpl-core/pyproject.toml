#  vpl-core — protocols, state types, units, registry, provenance.
#
#  doc 08 §1 principle 1: "the core depends only on protocols". This package therefore
#  has no scientific dependency heavier than NumPy. If a dependency here ever requires
#  a compiler, something has gone wrong with the layering.

[project]
name = "vpl-core"
version = "0.1.0"
description = "Astrophage VPL — core protocols, state model, units and provenance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Team Astrophage" }]
dependencies = [
    "numpy>=2.1",
    "pint>=0.24",
    # doc 09 §2.5: fundamental constants come from CODATA via scipy.constants,
    # never hand-typed. A mistyped electron mass is plausible, undetectable and
    # catastrophic. SciPy is already "buy" in the doc 08 §2 table.
    "scipy>=1.14",
    # The parameter registry (doc 02 §12) is YAML. OmegaConf/Hydra arrive with the
    # manifest engine; the registry only needs a safe loader, and vpl-core stays light.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Kept out of the base install so that `pip install vpl-core` stays light (doc 08 §3).
storage = [
    "h5py>=3.12",
    "zarr>=2.18",
    "pyarrow>=18.0",
]

[project.scripts]
# doc 08 §5's rule ships with the framework rather than living in a CI script, so a
# plugin author can run the same check the core is held to.
vpl-lint = "vpl.core.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpl"]

[tool.hatch.build.targets.wheel.force-include]
# PEP 561: without this marker every downstream package silently loses type checking
# against vpl-core, which is the one package doc 08 §12 puts under --strict.
"src/vpl/core/py.typed" = "vpl/core/py.typed"
# The registry data must travel with the package, or an installed wheel has no
# source of numeric defaults at all (doc 08 §5).
"src/vpl/core/params/data" = "vpl/core/params/data"
