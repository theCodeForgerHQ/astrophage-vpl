#  vpl-validation — doc 07.
#
#  Verification and validation are kept structurally separate (doc 07 §1): different
#  suites, different reports, different gates. This package holds the machinery both
#  need — convergence studies, error norms, the sealed-truth barrier, benchmark
#  definitions — and depends on no solver, so that a solver cannot influence the thing
#  that judges it.

[project]
name = "vpl-validation"
version = "0.1.0"
description = "Astrophage VPL — verification, validation and benchmarking machinery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Team Astrophage" }]
dependencies = [
    "vpl-core",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpl"]
