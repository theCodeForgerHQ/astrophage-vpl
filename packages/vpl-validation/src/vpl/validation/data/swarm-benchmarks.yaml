  # ---------------------------------------------------------------------------------
  # Reid ramp — Flynn et al (2024) Table 1, ISO-ISO rows.
  # <e> is tabulated there in 10^-1 eV and W_F in 10^4 m/s; both are expanded here.
  # ---------------------------------------------------------------------------------
